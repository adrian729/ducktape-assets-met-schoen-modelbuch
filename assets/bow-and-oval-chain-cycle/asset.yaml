# descriptive: find it and understand it
id: bow-and-oval-chain-cycle
title: "Oval chain border, one cycle"
description: "One cycle of the oval chain printed along the top of the page frame: a large horizontal oval loop followed by two small round loops, drawn as a doubled cord that crosses itself between them, over a thin rule along the bottom. Soft, heavily inked impression in dark brown-black on a transparent ground."
type: border
categories:
  - knotwork
  - geometric
subjects:
  - chain
  - loop
  - cord
  - rule
colors:
  - black
  - brown
facing: none
composition: repeat-tile

