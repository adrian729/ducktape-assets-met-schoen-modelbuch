# descriptive: find it and understand it
id: braided-diamond-knots-and-pointed-leaf-crosses
title: "Braided knot and fleur-de-lis border, one cycle"
description: "One cycle of a woodcut border: a quatrefoil cartouche encloses a braided knot of two diagonal dotted straps crossing at the centre, flanked left and right by a column of pointed leaves set as a cross around a fleur-de-lis, with C-scrolls and dots in the corners and half motifs cut at the top and bottom edges. Thin rules run along the top and bottom. Dark brown-black woodcut line on a transparent ground."
type: border
categories:
