# descriptive: find it and understand it
id: crossed-knots-and-four-foliate-scroll-panel
title: "Interlaced knots and four-lobed foliate scroll panel"
description: "Complete horizontal panel from the page: at each end a tall interlaced knot of pointed straps with a small rosette outside it, and in the centre a dotted lozenge boss from which four heart-shaped lobes filled with trefoil leaves curl up and down, joined to the knots by stems with five-petalled flowers and leaf sprigs. A band of short vertical hatching between two rules closes the bottom. Heavy dark brown-black woodcut line on a transparent ground."
