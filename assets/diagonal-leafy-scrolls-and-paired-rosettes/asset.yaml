# descriptive: find it and understand it
id: diagonal-leafy-scrolls-and-paired-rosettes
title: "Diagonal leafy scrolls and paired rosettes, one cycle"
description: "One cycle of a woodcut border: diagonal bands of curling leaves form a lozenge that encloses two daisy-like rosettes on leafy stems, with a column of paired C-scrolls around dots at the right, small trefoil leaves at the top and bottom edges and half rosettes cut at the edges. Thin rules run along the top and bottom. Dark brown-black line on a transparent ground."
type: border
categories:
