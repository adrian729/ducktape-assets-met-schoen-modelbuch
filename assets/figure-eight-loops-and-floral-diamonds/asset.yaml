# descriptive: find it and understand it
id: figure-eight-loops-and-floral-diamonds
title: "Figure-eight loops and floral diamonds panel"
description: "Complete horizontal panel: two diamonds enclosing eight-petalled rosettes stand side by side in the centre, with an eight-pointed leaf star between them above and below, and at each end an interlaced figure-eight loop with a curled acanthus leaf turned inward; small quatrefoils and dots fill the field. A band of short vertical hatching between two rules closes the bottom. Heavy dark brown-black woodcut line on a transparent ground."
