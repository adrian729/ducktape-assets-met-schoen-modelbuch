# descriptive: find it and understand it
id: horizontal-palmettes-and-four-lobed-scroll-cycle
title: "Fleuron border with four-lobed scrolls, one cycle"
description: "One cycle of the wide band along the bottom of the page frame, built from printer's fleurons: units of paired leafy C-scrolls whose volutes turn toward each other into a four-lobed figure alternate with a cross-shaped unit of four leaves around a central dot. Worn, heavily inked impression in dark brown-black on a transparent ground."
type: border
categories:
  - scrollwork
  - floral
subjects:
  - fleuron
  - scroll
  - leaf
  - palmette
colors:
  - black
  - brown
facing: none
composition: repeat-tile

