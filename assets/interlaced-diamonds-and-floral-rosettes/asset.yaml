# descriptive: find it and understand it
id: interlaced-diamonds-and-floral-rosettes
title: "Interlaced diamonds and rosettes, one cycle"
description: "One cycle of a woodcut border: two chains of interlaced diamond straps run through each other across the centre and enclose a seven-petalled rosette, with a rosette above and below in the field at the right and small dots between; a double rule runs along the top and a band of short vertical hatching between two rules along the bottom. Dark brown-black line on a transparent ground."
type: border
categories:
