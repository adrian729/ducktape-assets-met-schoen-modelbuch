id: knotted-straps-with-flowers-and-leaves
title: "Knotted straps with flowers and leaves"
description: "A section of a large knotwork page: an upright figure-eight loop of doubled strap at the left and a braided square knot at the right, linked by looped straps, with five-petalled flowers, curled leaves and sprigs filling the gaps; a vertical braided band is cut along the left edge and a further loop is cut at the right edge. Heavy dark brown-black woodcut line on a transparent ground."
