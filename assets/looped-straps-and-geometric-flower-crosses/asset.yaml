# descriptive: find it and understand it
id: looped-straps-and-geometric-flower-crosses
title: "Looped straps and cross-flower diamonds, one cycle"
description: "One cycle of a woodcut border: an interlaced strap with looped ends and dotted bands alternates with a square set on its corner that holds a four-petalled cross flower around a dot, the strap looping through the square's corners; dots fill the field, a thin rule runs along the top and a band of short vertical hatching between two rules along the bottom. Dark brown-black line on a transparent ground."
type: border
