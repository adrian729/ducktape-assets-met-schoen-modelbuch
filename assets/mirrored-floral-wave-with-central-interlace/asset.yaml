id: mirrored-floral-wave-with-central-interlace
title: "Floral wave strip with central knot"
description: "Complete thin strip: an interlaced lozenge knot of straps in the centre, from which a wavy stem scrolls out to each side carrying curled leaves, five-petalled flowers and dots, each end turning down into a leaf scroll; the two halves mirror each other. A thin rule runs along the bottom. Dark brown-black woodcut line on a transparent ground."
