# descriptive: find it and understand it
id: mixed-oval-chain-and-floral-printer-frame
title: "Printer's frame of oval chain and fleurons"
description: "The complete rectangular frame printed around the page, with its interior cleared: an oval chain of doubled cord along the top with a small asterisk in it, a column of leafy scroll fleurons down each side and a wider band of paired-scroll and four-leaf fleurons along the bottom. The four sides do not match and the bands run slightly uneven. Worn, heavily inked impression in dark brown-black; inside and outside the frame transparent."
type: frame
