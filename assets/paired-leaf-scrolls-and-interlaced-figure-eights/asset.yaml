# descriptive: find it and understand it
id: paired-leaf-scrolls-and-interlaced-figure-eights
title: "Chain links with leaf scrolls and figure-eight knots, one cycle"
description: "One cycle of a woodcut border: two interlocking rings joined by dotted oval chain links run across the centre, with a pair of curled leaves sprouting up and down from the join, and at the right an interlaced figure-eight knot whose four loops each hold a dot; a thin rule runs along the bottom. Dark brown-black line on a transparent ground."
type: border
