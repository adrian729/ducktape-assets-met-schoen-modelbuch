# descriptive: find it and understand it
id: palmette-scroll-printer-frame
title: "Printer's frame of palmette fleurons"
description: "The complete rectangular frame printed around the page, with its interior cleared, built from printer's fleurons of paired leafy scrolls around a small palmette repeated along all four sides; the top band is narrower than the other three and the corner joins are as printed. Heavily inked impression in dark brown-black with some broken strokes; inside and outside the frame transparent."
type: frame
categories:
  - scrollwork
  - floral
subjects:
  - frame
  - fleuron
  - palmette
  - scroll
  - leaf
colors:
  - black
  - brown
facing: none
composition: single-ornament

