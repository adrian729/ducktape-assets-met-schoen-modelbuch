# descriptive: find it and understand it
id: stacked-star-loops-and-knotted-floral-diamonds
title: "Knotted diamonds with rosettes and star loops, one cycle"
description: "One cycle of a woodcut border in two registers: in each register an elongated diamond of straps with bound corners encloses a lobed rosette, set between figure-eight loops of doubled strap cut at the left and right edges, with eight-pointed leaf stars in the gaps; a heavy rule runs along the top and a thin one along the bottom. Dark brown-black line on a transparent ground."
type: border
categories:
