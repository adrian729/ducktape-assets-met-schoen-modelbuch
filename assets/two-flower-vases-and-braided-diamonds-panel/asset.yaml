id: two-flower-vases-and-braided-diamonds-panel
title: "Flower vases and braided diamonds panel"
description: "Complete horizontal panel: two fluted vases on stepped, patterned pedestals, each holding a trefoil leaf and flowers on stems, alternate with two tall braided diamond knots of dotted straps; five-petalled flowers and dots fill the field. The left vase stands on a zigzag base and the right one on a scalloped base. Dark brown-black woodcut line on a transparent ground."
