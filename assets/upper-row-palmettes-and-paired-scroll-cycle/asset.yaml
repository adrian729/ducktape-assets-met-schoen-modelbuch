# descriptive: find it and understand it
id: upper-row-palmettes-and-paired-scroll-cycle
title: "Narrow fleuron border, one cycle"
description: "One cycle of the narrow band along the top of the page frame, built from printer's fleurons: paired leafy C-scrolls alternate with a small upright palmette between two leaves. Heavily inked impression in dark brown-black with partly broken strokes, on a transparent ground."
type: border
categories:
  - scrollwork
  - floral
subjects:
  - fleuron
  - scroll
  - palmette
  - leaf
colors:
  - black
  - brown
facing: none
composition: repeat-tile

