# descriptive: find it and understand it
id: wavy-rule-band
title: "Wavy rule band, three waves"
description: "A short run of the wavy rule that separates the pattern bands on the page: a single undulating line of three waves between a heavy rule above and a double rule below. Dark brown-black ink on a transparent ground, only 29 px tall."
type: border
categories:
  - geometric
